```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pothole Detection Manager</title>

<style>

body{
    font-family: Arial;
    margin:0;
    background:#f4f4f4;
}

.container{
    display:flex;
    height:100vh;
}

.left-panel{
    width:300px;
    background:white;
    padding:15px;
    border-right:1px solid #ccc;
}

.right-panel{
    flex:1;
    padding:20px;
    text-align:center;
}

h3{
    margin-top:15px;
}

button{
    width:100%;
    padding:8px;
    margin:5px 0;
    cursor:pointer;
}

.listbox{
    width:100%;
    height:150px;
}

video{
    width:640px;
    height:360px;
    background:black;
}

.progress{
    width:600px;
    height:20px;
}

.crops{
    margin-top:15px;
    display:flex;
    overflow-x:auto;
    gap:5px;
}

.crop-img{
    width:80px;
    height:80px;
    border:1px solid #ccc;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT PANEL -->
<div class="left-panel">

<h3>Input Videos</h3>

<input type="file" multiple>

<button>Process Selected</button>
<button>Watch Input</button>

<h3>Output Videos</h3>

<select class="listbox" multiple></select>

<button>Watch Output</button>

</div>


<!-- RIGHT PANEL -->
<div class="right-panel">

<h2>Pothole Detection Manager</h2>

<video controls></video>

<br><br>

<progress class="progress" value="0" max="100"></progress>

<br><br>

<button>Pause</button>

<h3>Detected Potholes</h3>

<div class="crops">

<img class="crop-img">
<img class="crop-img">
<img class="crop-img">

</div>

</div>

</div>

</body>
</html>
