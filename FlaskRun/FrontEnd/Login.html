<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Pothole Detection Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="icon"
          type="image/jpeg"
          href="{{ url_for('static', filename='potholeImage/pothole-clipart.jpg') }}">
</head>



<body>
    <div class="login-page">

        <div class="login-card">

            <div class="title-row login-title">
                <img src="{{ url_for('static', filename='potholeImage/pothole-clipart.jpg') }}"
                    alt="Pothole Detection Manager logo"
                    class="panel-image">

                <h2>Pothole Detection Manager</h2>
            </div>

            <h1 class="login-heading">Login</h1>

            <form action="/login" method="POST">

                <input type="text"
                    name="username"
                    placeholder="Username"
                    required>

                <input type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">
                    Login
                </button>
                {% if login_error %}
                    <p class="error-message">{{ login_error }}</p>
                {% endif %}

            </form>

            <h1 class="login-heading">Sign Up</h1>

            <form action="/signup" method="POST" id="signup-form">

                <input type="text"
                    name="username"
                    placeholder="Create username"
                    required>

                <input type="password"
                    name="password"
                    id="signup-password"
                    placeholder="Create password"
                    required>

                <input type="password"
                    name="confirm_password"
                    id="confirm_password"
                    placeholder="Confirm password"
                    required>

                <p id="password-message"></p>

                <button type="submit">
                    Sign Up
                </button>
                {% if signup_error %}
                    <p class="error-message">{{ signup_error }}</p>
                {% endif %}

            </form>

            <a class="back-link" href="/">
                Back to Home
            </a>

        </div>
    </div>




    <!-- Check Confirm Password Script -->
    <script>

        const signupForm = document.getElementById("signup-form");

        const passwordInput = document.getElementById("signup-password");
        const confirmInput = document.getElementById("confirm_password");

        const message = document.getElementById("password-message");

        function checkPasswords() {

            if (confirmInput.value === "") {
                message.textContent = "";
                return;
            }

            if (passwordInput.value === confirmInput.value) {

                message.textContent = "Passwords match";
                message.style.color = "#22c55e";
            }
            else {

                message.textContent = "Passwords do not match";
                message.style.color = "#ff4d4d";
            }
        }

        passwordInput.addEventListener("input", checkPasswords);
        confirmInput.addEventListener("input", checkPasswords);

        signupForm.addEventListener("submit", function(event) {

            if (passwordInput.value !== confirmInput.value) {

                event.preventDefault();

                message.textContent = "Passwords do not match";
                message.style.color = "#ff4d4d";
            }
        });

    </script>

</body>








</html>
